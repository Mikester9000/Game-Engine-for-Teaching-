[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-baker"
version = "1.0.0"
description = "Quest and dialogue content baking tool for the educational RPG engine (M20)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["quest", "dialogue", "baker", "game-engine", "rpg"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
quest-baker = "quest_baker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quest_baker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
