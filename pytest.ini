[pytest]
# TEACHING NOTE — Root-level pytest import mode
# ---------------------------------------------
# Multiple subsystems include a `tests` package (repo root tests + tool tests).
# In pytest's default `prepend` import mode, these package names can collide
# during collection when running the *entire* suite from repo root.
#
# `importlib` mode loads each test module via importlib using its file location,
# avoiding cross-package name collisions while preserving normal test semantics.
addopts = --import-mode=importlib
