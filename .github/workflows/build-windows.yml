name: Build Windows (engine_sandbox + cook)

# ============================================================================
# TEACHING NOTE — Windows CI Workflow Structure
# ============================================================================
# Three jobs validate the full Windows toolchain on every push/PR:
#
#   build-windows-engine  — two builds in one job: D3D11-only + Jolt-only.
#                           D3D11-only binary runs all rendering/streaming/
#                           audio/save tests using --scene (never bare
#                           --headless, which crashes on the 1 MB CI stack).
#                           Jolt binary runs only physics_test/vehicle_test/
#                           terrain_test.
#
#   build-windows-editor  — Dear ImGui creation-suite-editor; separate because
#                           imgui adds ~2 min of vcpkg compile time.
#
#   build-windows-demo    — demo_game.exe standalone executable.
#
# Vulkan is deferred: build-windows-vulkan is removed until a self-hosted GPU
# runner with a real Vulkan ICD is available.  Vulkan source still compiles
# correctly — it is just not exercised in CI at this time.
# ============================================================================

on:
  push:
    paths:
      - 'src/**'
      - 'editor/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'shaders/**'
      - 'shared/**'
      - 'samples/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'editor/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'shaders/**'
      - 'shared/**'
      - 'samples/**'
      - '.github/workflows/build-windows.yml'

jobs:

  # ==========================================================================
  # Job 1 — All engine subsystem tests (D3D11 rendering + Jolt Physics)
  # ==========================================================================
  # TEACHING NOTE — Why two builds in one job?
  # The MSVC Debug binary (engine_sandbox) crashes with STATUS_STACK_OVERFLOW
  # (0xC00000FD) when run as bare `--headless` (no scene argument) on
  # GitHub-hosted Windows runners.  The 1 MB default thread stack is exhausted
  # by D3D11 WARP device init + LuaEngine startup + deep MSVC Debug frames
  # before any scene code executes.  This happens with both the engine-only
  # build (no Jolt) and the physics build (Jolt).
  #
  # The solution used here:
  #   1. NEVER run bare --headless.  All tests use --headless --scene <name>.
  #      The textured_quad scene is the first to call renderer->Init() and
  #      therefore implicitly validates D3D11 WARP device creation.
  #   2. Use TWO engine_sandbox builds in one CI job:
  #      • windows-ninja-debug-engine-only  — D3D11 only, no Jolt; runs all
  #        rendering / streaming / audio / animation / save-system tests.
  #      • windows-ninja-debug-physics      — D3D11 + Jolt; runs ONLY the three
  #        physics-specific tests (physics_test, vehicle_test, terrain_test).
  #
  # This is still exactly 3 CI jobs total (engine + editor + demo).
  # ==========================================================================
  build-windows-engine:
    name: Build Windows - Engine (D3D11 + Physics + all engine tests)
    runs-on: windows-latest
    continue-on-error: false

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TEACHING NOTE — Without vcvars, CMake may detect a GNU toolchain and
      # fail to link Windows SDK libraries (xaudio2.lib, d3d11.lib, etc.).
      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # -----------------------------------------------------------------------
      # Build 1 of 2: engine-only (D3D11, no Jolt).
      # Used for all rendering / streaming / audio / save-system tests.
      # No vcpkg dependency — nlohmann/json is vendored, Jolt not needed.
      # -----------------------------------------------------------------------
      - name: Configure CMake (D3D11 engine-only — no Jolt)
        run: cmake --preset windows-ninja-debug-engine-only
        shell: cmd

      - name: Build engine_sandbox (engine-only)
        run: cmake --build --preset windows-ninja-debug-engine-only --target engine_sandbox
        shell: cmd

      - name: Build cook
        run: cmake --build --preset windows-ninja-debug-engine-only --target cook
        shell: cmd

      - name: Build pak
        run: cmake --build --preset windows-ninja-debug-engine-only --target pak
        shell: cmd

      - name: Verify engine-only binaries exist
        shell: pwsh
        run: |
          if (-not (Test-Path "build\windows-ninja-debug-engine-only\engine_sandbox.exe")) { throw "engine_sandbox.exe not found" }
          if (-not (Test-Path "build\windows-ninja-debug-engine-only\cook.exe"))           { throw "cook.exe not found" }
          if (-not (Test-Path "build\windows-ninja-debug-engine-only\pak.exe"))            { throw "pak.exe not found" }

      # -----------------------------------------------------------------------
      # Engine headless acceptance tests using the engine-only binary.
      # All run on D3D11 WARP (CPU software rasteriser) — no GPU required.
      # TEACHING NOTE — Why no bare --headless (M0) test?
      # engine_sandbox.exe --headless (no scene) crashes with
      # STATUS_STACK_OVERFLOW (0xC00000FD) on GitHub-hosted Windows runners
      # regardless of whether Jolt Physics is compiled in.  The runner's 1 MB
      # default stack is exhausted by the combination of D3D11 WARP device init,
      # LuaEngine startup, and the deep MSVC Debug call frames.  D3D11 WARP
      # device initialisation is fully covered by the textured_quad scene below
      # (the first scene call that reaches renderer->Init()).
      # -----------------------------------------------------------------------

      # M3 — Textures (D3D11 DDS pipeline)
      - name: Run headless validation (M3 - textured_quad)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene textured_quad
        shell: cmd

      # M4b — Animation / GPU skinning
      - name: Run headless validation (M4b - skinned_mesh)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene skinned_mesh
        shell: cmd

      # M7 — World streaming
      - name: Run headless acceptance test (M7 - streaming_load)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene streaming_load
        shell: cmd

      - name: Run headless acceptance test (M7 - streaming_evict)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene streaming_evict
        shell: cmd

      - name: Run headless acceptance test (M7 - streaming_async)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene streaming_async
        shell: cmd

      # M8 — Gameplay integration (all ECS systems, 60 frames)
      - name: Run headless acceptance test (M8 - m8_gameplay)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene m8_gameplay
        shell: cmd

      # M9 — PBR rendering (Cook-Torrance BRDF on WARP)
      - name: Run headless validation (M9 - pbr_mesh)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene pbr_mesh
        shell: cmd

      # M10 — Dynamic sky + weather VFX
      - name: Run headless acceptance test (M10 - dynamic_sky)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene dynamic_sky
        shell: cmd

      # -----------------------------------------------------------------------
      # Cook vertical slice then run asset-dependent tests.
      # -----------------------------------------------------------------------
      - name: Cook vertical slice project
        run: .\build\windows-ninja-debug-engine-only\cook.exe --project samples\vertical_slice_project --verbose
        shell: cmd

      - name: Verify cells_manifest.json was generated
        shell: pwsh
        run: |
          $manifest = "samples\vertical_slice_project\Cooked\Levels\cells_manifest.json"
          if (-not (Test-Path $manifest)) {
            Write-Error "cells_manifest.json not found at $manifest"
            exit 1
          }
          $json = Get-Content $manifest | ConvertFrom-Json
          if ($json.cells.Count -lt 1) {
            Write-Error "cells_manifest.json has no entries"
            exit 1
          }
          Write-Host "cells_manifest.json OK: $($json.cells.Count) cell(s)."

      - name: Validate-project (AssetDB + cells_manifest)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --validate-project samples\vertical_slice_project
        shell: cmd

      # M8.7 — Zone streaming into D3D11 (requires cooked assets)
      - name: Run headless acceptance test (M8.7 - m8_streaming)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene m8_streaming
        shell: cmd

      # Post-M10 — Behaviour tree AI (BtTree, FormationSystem, NavMesh)
      - name: Run headless acceptance test (Post-M10 - bt_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene bt_test
        shell: cmd

      # Post-M10 — Cinematics (CinematicSequencer, CameraRig, audio events)
      - name: Run headless acceptance test (Post-M10 - cinematic_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene cinematic_test
        shell: cmd

      # UI — Menu stack navigation
      - name: Run headless acceptance test (UI - menu_stack_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene menu_stack_test
        shell: cmd

      # UI — SDF font renderer
      - name: Run headless acceptance test (Font - font_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene font_test
        shell: cmd

      # M16 — PBR + IBL (BRDF LUT, irradiance + prefiltered env cubemaps)
      - name: Run headless acceptance test (M16 - pbr_ibl)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene pbr_ibl
        shell: cmd

      # M17 — Directional shadow maps (PCF, depth bias)
      - name: Run headless acceptance test (M17 - shadow_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene shadow_test
        shell: cmd

      # M17 — HDR bloom post-processing
      - name: Run headless acceptance test (M17 - bloom_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene bloom_test
        shell: cmd

      # M18 — X3DAudio 3D positional audio
      - name: Run headless acceptance test (M18 - audio_3d_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene audio_3d_test
        shell: cmd

      # M19 — Action combat combo FSM
      - name: Run headless acceptance test (M19 - combat_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene combat_test
        shell: cmd

      # M20 — Quest + dialogue systems
      - name: Run headless acceptance test (M20 - quest_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene quest_test
        shell: cmd

      - name: Run headless acceptance test (M20 - dialogue_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene dialogue_test
        shell: cmd

      # M26 — Save system (slot round-trip, migration, autosave).
      # TEACHING NOTE: ENGINE_ENABLE_JSON is always ON via vendored json.hpp so
      # this test runs the full suite without any separate vcpkg install.
      - name: Run headless save-system acceptance tests (M26 - save_test)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene save_test
        shell: cmd

      # M25 — Terrain: renderer init + heightmap displacement (subtests 1+2).
      # TEACHING NOTE — terrain_test detects ENGINE_ENABLE_PHYSICS at runtime.
      # Subtest 3 (physics_collision via Jolt) auto-skips in the engine-only
      # binary (no ENGINE_ENABLE_PHYSICS define) and prints "SKIP".
      # The physics build below re-runs the same scene to exercise subtest 3.
      - name: Run terrain renderer+heightmap subtests (M25 - engine-only)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene terrain_test
        shell: cmd

      # M24 — Authored content (DDS texture cook + magic-byte verification)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow for cook_assets.py (M24)
        run: python -m pip install "Pillow>=11.1.0"

      - name: Run cook_assets.py (M24 - cook DDS textures)
        run: python samples\vertical_slice_project\cook_assets.py
        shell: cmd

      - name: Run authored_content acceptance test (M24 - DDS magic)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene authored_content
        shell: cmd

      # PAK packager — pack, extract, validate
      - name: Run PAK packager test
        run: .\build\windows-ninja-debug-engine-only\pak.exe --input samples\vertical_slice_project\Cooked\ --output samples\vertical_slice_project\Cooked\test_output.pak
        shell: cmd

      - name: Extract PAK archive
        run: .\build\windows-ninja-debug-engine-only\pak.exe --extract samples\vertical_slice_project\Cooked\test_output.pak --output %TEMP%\pak_extracted\Cooked
        shell: cmd

      - name: Validate extracted PAK content
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --validate-project %TEMP%\pak_extracted
        shell: cmd

      # Python tool tests (audio_authoring, anim_authoring, quest_baker, contracts)
      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt --quiet

      - name: Run Python tool tests on Windows
        run: python -m pytest tools/tests/ tests/ -q --tb=short

      # Demo_world scene via engine_sandbox path
      - name: Run Demo_Game acceptance test (demo_world - sandbox path)
        run: .\build\windows-ninja-debug-engine-only\engine_sandbox.exe --headless --scene demo_world
        shell: cmd

      # -----------------------------------------------------------------------
      # Build 2 of 2: physics-enabled (D3D11 + Jolt).
      # TEACHING NOTE — This build is kept separate (built last) because Jolt's
      # Debug build emits large stack frames that cause STATUS_STACK_OVERFLOW
      # when the binary is used for non-physics scenes.  The engine-only binary
      # runs all rendering/streaming/audio tests above; the physics binary runs
      # only the three physics-specific acceptance tests below.
      # -----------------------------------------------------------------------
      - name: Cache vcpkg packages (joltphysics)
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-joltphysics-${{ runner.os }}-x64

      - name: Install joltphysics via vcpkg (classic mode)
        shell: pwsh
        run: |
          Set-Location "$env:TEMP"
          C:\vcpkg\vcpkg.exe install joltphysics:x64-windows

      - name: Configure CMake (D3D11 + Jolt Physics)
        shell: pwsh
        run: >
          cmake --preset windows-ninja-debug-physics
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_INSTALL=OFF

      - name: Build engine_sandbox (physics)
        run: cmake --build --preset windows-ninja-debug-physics --target engine_sandbox
        shell: cmd

      - name: Verify physics engine_sandbox.exe exists
        shell: pwsh
        run: if (-not (Test-Path "build\windows-ninja-debug-physics\engine_sandbox.exe")) { throw "physics engine_sandbox.exe not found" }

      # M5 — Jolt Physics (rigid body, character controller, raycast)
      - name: Run physics acceptance tests (M5 - physics_test)
        run: .\build\windows-ninja-debug-physics\engine_sandbox.exe --headless --scene physics_test
        shell: cmd

      # Post-M10 — Vehicle physics (suspension, throttle, grounding)
      - name: Run vehicle physics acceptance tests (Post-M10 - vehicle_test)
        run: .\build\windows-ninja-debug-physics\engine_sandbox.exe --headless --scene vehicle_test
        shell: cmd

      # M25 — Terrain physics collision (Jolt subtest 3).
      # TEACHING NOTE — terrain_test has 3 subtests:
      #   1. renderer_init         — runs in both builds
      #   2. heightmap_displacement — runs in both builds
      #   3. physics_collision      — only active when ENGINE_ENABLE_PHYSICS is
      #                               defined (i.e. this physics build).
      # The engine-only run above exercised subtests 1+2.  This run adds
      # subtest 3 (Jolt rigid-body drop) without re-failing the earlier two.
      - name: Run terrain physics collision subtest (M25 - physics build)
        run: .\build\windows-ninja-debug-physics\engine_sandbox.exe --headless --scene terrain_test
        shell: cmd

  # ==========================================================================
  # Job 2 — Editor Suite (Dear ImGui creation-suite-editor)
  # ==========================================================================
  # TEACHING NOTE — Editor job kept separate because imgui requires vcpkg and
  # adds ~2 minutes of compile time.  Separating it avoids lengthening the
  # critical path for engine PRs that do not touch editor code.
  # ==========================================================================
  build-windows-editor:
    name: Build Windows - Editor Suite (creation-suite-editor)
    runs-on: windows-latest
    continue-on-error: false

    env:
      # Pin to 2024.12.16 where the imgui feature is "docking-experimental".
      VCPKG_TAG: "2024.12.16"

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone and bootstrap vcpkg (pinned to ${{ env.VCPKG_TAG }})
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg" --depth 1 --branch $env:VCPKG_TAG
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Cache vcpkg packages (editor)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg\installed
          key: vcpkg-editor-${{ runner.os }}-x64-${{ env.VCPKG_TAG }}-${{ hashFiles('editor/CMakeLists.txt') }}
          restore-keys: vcpkg-editor-${{ runner.os }}-x64-${{ env.VCPKG_TAG }}

      - name: Install imgui + nlohmann-json via vcpkg (classic mode)
        shell: pwsh
        run: |
          Set-Location "$env:TEMP"
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install "imgui[docking-experimental,dx11-binding,win32-binding]:x64-windows" nlohmann-json:x64-windows

      # TEACHING NOTE — VCPKG_INSTALLED_DIR overrides the path so CMake finds
      # packages from the classic-mode install rather than manifest-mode default.
      - name: Configure CMake (D3D11 + Editor)
        shell: pwsh
        run: >
          cmake --preset windows-ninja-debug-editor
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_INSTALL=OFF
          "-DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg/installed"

      - name: Build creation-suite-editor
        run: cmake --build --preset windows-ninja-debug-editor --target creation-suite-editor

      - name: Verify creation-suite-editor.exe exists
        shell: pwsh
        run: if (-not (Test-Path "build\windows-ninja-debug-editor\creation-suite-editor.exe")) { throw "creation-suite-editor.exe not found" }

      - name: Run headless editor validation (M6)
        shell: cmd
        run: .\build\windows-ninja-debug-editor\creation-suite-editor.exe --headless

      - name: Run headless scene round-trip (M6)
        shell: cmd
        run: |
          .\build\windows-ninja-debug-editor\creation-suite-editor.exe --headless --create-scene "%TEMP%\ci_basic.scene.json"
          .\build\windows-ninja-debug-editor\creation-suite-editor.exe --headless --load-scene "%TEMP%\ci_basic.scene.json" --validate

  # ==========================================================================
  # Job 3 — Demo_Game standalone executable
  # ==========================================================================
  # TEACHING NOTE — Validates demo_game.exe through the demo_main.cpp entry
  # point (different code path from the sandbox demo_world test above).
  # Uses the windows-ninja-debug-demo preset (BUILD_DEMO_GAME=ON).
  # nlohmann/json is now vendored so no vcpkg install is needed here.
  # ==========================================================================
  build-windows-demo:
    name: Build Windows - Demo_Game executable
    runs-on: windows-latest
    continue-on-error: false

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Ninja
        run: choco install ninja -y --no-progress
        shell: cmd

      - name: Configure CMake (D3D11 + Demo_Game)
        run: cmake --preset windows-ninja-debug-demo
        shell: cmd

      - name: Build engine_sandbox + demo_game + cook
        run: cmake --build --preset windows-ninja-debug-demo
        shell: cmd

      - name: Verify demo_game.exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path "build\windows-ninja-debug-demo\demo_game.exe")) {
            throw "demo_game.exe not found"
          }
          Write-Host "[OK] demo_game.exe found."

      - name: Run Demo_Game headless acceptance test (demo_main path)
        run: .\build\windows-ninja-debug-demo\demo_game.exe --headless
        shell: cmd
