name: Build Linux (Terminal Game)

# ============================================================================
# TEACHING NOTE — CI Workflow Purpose
# ============================================================================
# This workflow validates the Linux terminal game target on every push and
# pull request.  It ensures:
#
#   1. The CMake configure step succeeds.
#   2. The C++ code compiles without errors.
#   3. The Python authoring tool test suites (audio + animation) pass.
#
# The Vulkan engine_sandbox target is Windows-only (VkSurfaceKHR requires a
# Win32 HWND).  Its build is validated in the build-windows workflow.
#
# ============================================================================
# TEACHING NOTE — GitHub Actions Triggers
# ============================================================================
# push / pull_request with paths filters mean this workflow only runs when
# relevant files change.  CI time is precious — don't run the full build for
# a docs-only change.
# ============================================================================

on:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'tools/**'
      - 'shared/**'
      - '.github/workflows/build-linux.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'tools/**'
      - 'shared/**'
      - '.github/workflows/build-linux.yml'

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Build the terminal game target
  # --------------------------------------------------------------------------
  build-terminal-game:
    name: Build terminal game (Ubuntu)
    runs-on: ubuntu-latest
    # TEACHING NOTE — Least-Privilege Permissions
    # GitHub Actions tokens default to write access.  Explicitly restricting
    # to read-only (contents: read) follows the principle of least privilege —
    # a compromised action cannot push or modify the repository.
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # TEACHING NOTE — actions/checkout
      # Clones the repository into the runner's workspace so subsequent steps
      # can access the source files.  fetch-depth: 0 gives the full git history
      # (needed if any step references git tags or the commit count).
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # TEACHING NOTE — Installing Dependencies
      # The terminal game requires:
      #   cmake    — build system generator
      #   build-essential — GCC + Make
      #   libncurses5-dev — ncurses terminal renderer
      #   liblua5.4-dev   — Lua 5.4 scripting engine
      # -----------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            libncurses5-dev \
            libncursesw5-dev \
            liblua5.4-dev

      # -----------------------------------------------------------------------
      # Configure the CMake build.
      # ENGINE_ENABLE_TERMINAL=ON  — build the ncurses terminal game target.
      # ENGINE_ENABLE_VULKAN=OFF   — Vulkan requires a Win32 surface, not on Linux.
      # -----------------------------------------------------------------------
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENGINE_ENABLE_TERMINAL=ON \
            -DENGINE_ENABLE_VULKAN=OFF

      # -----------------------------------------------------------------------
      # TEACHING NOTE — Parallel Build (-j)
      # $(nproc) returns the number of logical CPU cores on the runner.
      # Passing -j$(nproc) to make enables parallel compilation, which is
      # significantly faster than single-threaded compilation on multi-core CI
      # runners.
      # -----------------------------------------------------------------------
      - name: Build
        run: cmake --build build --config Debug -- -j$(nproc)

      # -----------------------------------------------------------------------
      # Verify the game binary was produced.
      # -----------------------------------------------------------------------
      - name: Verify binary exists
        run: test -f build/game

      # -----------------------------------------------------------------------
      # Verify the cook binary was produced (cross-platform tool).
      # -----------------------------------------------------------------------
      # TEACHING NOTE — cook is not Vulkan-dependent
      # The cook tool uses only C++17 standard library (std::filesystem,
      # std::fstream, etc.) and our Logger.  It builds on Linux as well as
      # Windows.  We verify it here to catch compile errors early.
      # -----------------------------------------------------------------------
      - name: Verify cook binary exists
        run: test -f build/cook

  # --------------------------------------------------------------------------
  # Job 2: Python tool tests (audio_authoring + anim_authoring)
  # --------------------------------------------------------------------------
  python-tool-tests:
    name: Python authoring tool tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # TEACHING NOTE — Python Setup
      # We pin to Python 3.11 for reproducibility.  The tools require 3.9+.
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audio_authoring tool + test dependencies
        run: |
          cd tools/audio_authoring
          pip install -e ".[dev]"

      - name: Run audio_authoring tests
        run: |
          cd tools/audio_authoring
          python -m pytest tests/ -q --tb=short

      - name: Install anim_authoring tool + test dependencies
        run: |
          cd tools/anim_authoring
          pip install -e ".[dev]"

      - name: Run anim_authoring tests
        run: |
          cd tools/anim_authoring
          python -m pytest tests/ -q --tb=short

      - name: Install quest_baker tool + test dependencies
        run: |
          cd tools/quest_baker
          pip install -e ".[dev]"

      - name: Run quest_baker tests
        run: |
          cd tools/quest_baker
          python -m pytest tests/ -q --tb=short

      - name: Run creation_engine baker tests (M21 + M27)
        run: |
          python -m pytest tools/tests/test_creation_engine_bakers.py -q --tb=short

      # TEACHING NOTE — M27 baker smoke tests
      # These steps exercise the three new bakers end-to-end with the sample
      # assets committed in samples/vertical_slice_project/Content/.  They
      # complement the pytest contract tests by running the CLI interface directly,
      # catching any argument-parser or file-path regressions.
      - name: Smoke-test bake-collision (M27)
        run: |
          python tools/creation_engine.py bake-collision \
            --input  samples/vertical_slice_project/Content/AI/arena_plane.obj \
            --output /tmp/arena_plane.phys
          test -f /tmp/arena_plane.phys
          python3 -c "
          import struct, sys
          blob = open('/tmp/arena_plane.phys','rb').read()
          magic, ver, vc, ic = struct.unpack('<4sHII', blob[:14])
          assert magic == b'PHY1', f'Bad magic: {magic}'
          assert ver == 1
          assert vc > 0 and ic > 0 and ic % 3 == 0
          print(f'[OK] PHY1: {vc} verts, {ic} indices, {len(blob)} bytes')
          "

      - name: Smoke-test bake-font (M27)
        run: |
          python tools/creation_engine.py bake-font \
            --input  samples/vertical_slice_project/Content/UI/Fonts/ffxv_ui.font.json \
            --output /tmp/ffxv_ui.font
          test -f /tmp/ffxv_ui.font
          python3 -c "
          import struct
          blob = open('/tmp/ffxv_ui.font','rb').read()
          magic, ver, aw, ah, gc, gs, fc = struct.unpack('<4sHHHHHH', blob[:16])
          assert magic == b'FNT1', f'Bad magic: {magic}'
          assert ver == 1 and aw == 128 and ah == 48 and gc == 96
          print(f'[OK] FNT1: {gc} glyphs, {aw}x{ah} atlas, {len(blob)} bytes')
          "

      - name: Smoke-test bake-road (M27)
        run: |
          python tools/creation_engine.py bake-road \
            --input  samples/vertical_slice_project/Content/Roads/regalia_route.road.json \
            --output /tmp/regalia_route.road
          test -f /tmp/regalia_route.road
          python3 -c "
          import struct
          blob = open('/tmp/regalia_route.road','rb').read()
          magic, ver, wc = struct.unpack('<4sHI', blob[:10])
          assert magic == b'RD01', f'Bad magic: {magic}'
          assert ver == 1 and wc == 12
          print(f'[OK] RD01: {wc} waypoints, {len(blob)} bytes')
          "
